<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Middle Frame</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 1rem; }
    iframe { width: 100%; height: 320px; border: 1px solid #aaa; }
  </style>
</head>
<body>
  <p>This is the middle frame. The form lives inside the next iframe.</p>
  <iframe id="inner-frame" src="./inner.html"></iframe>
  <script>
    window.addEventListener("message", (e) => {
      if (e.data && e.data.__webdrive_event === "form_submitted") {
        window.parent.postMessage(e.data, "*");
      }
    });
  </script>
</body>
</html>
