<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nested Iframe Form</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; }
    iframe { width: 100%; height: 400px; border: 1px solid #ccc; }
    #status { padding: 1rem; margin-top: 1rem; background: #f5f5f5; }
  </style>
</head>
<body>
  <h1>Challenge: Nested Iframe Form</h1>
  <p><strong>Objective:</strong> Submit the form inside the nested iframe with name "Alice" and email "alice@example.com".</p>
  <iframe id="middle-frame" src="./middle.html"></iframe>
  <div id="status">Waiting for submission…</div>
  <script>
    window.__webdrive = {
      challenge_id: "challenge-course/01-nested-iframe",
      domain: "challenge-course",
      objective: "Submit the form inside the nested iframe with name=Alice and email=alice@example.com",
      timeout_ms: 43200000,
      started_at: Date.now(),
      result: null,
    };

    window.addEventListener("message", (e) => {
      if (e.data && e.data.__webdrive_event === "form_submitted") {
        const { name, email } = e.data.payload || {};
        const passed = name === "Alice" && email === "alice@example.com";
        window.__webdrive.result = {
          passed,
          evidence: { name, email },
          time_ms: Date.now() - window.__webdrive.started_at,
        };
        document.getElementById("status").textContent = passed
          ? "PASS — form submitted with correct values."
          : `FAIL — got name=${name}, email=${email}`;
      }
    });
  </script>
</body>
</html>
