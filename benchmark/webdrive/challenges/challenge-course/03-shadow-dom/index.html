<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shadow DOM</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 600px; margin: 0 auto; }
    #status { padding: 1rem; margin-top: 1rem; background: #f5f5f5; }
  </style>
</head>
<body>
  <h1>Challenge: Shadow DOM</h1>
  <p><strong>Objective:</strong> Type "hello world" into the input below and click Submit. The input lives inside an open shadow root.</p>

  <shadow-form></shadow-form>

  <div id="status">Waiting for submission…</div>

  <script>
    window.__webdrive = {
      challenge_id: "challenge-course/03-shadow-dom",
      domain: "challenge-course",
      objective: "Type 'hello world' into the shadow-rooted input and submit",
      timeout_ms: 43200000,
      started_at: Date.now(),
      result: null,
    };

    class ShadowForm extends HTMLElement {
      constructor() {
        super();
        const root = this.attachShadow({ mode: "open" });
        root.innerHTML = `
          <style>
            :host { display: block; }
            input { width: 100%; padding: 0.5rem; box-sizing: border-box; }
            button { margin-top: 0.5rem; padding: 0.5rem 1rem; }
          </style>
          <input id="message" type="text" placeholder="Enter message" />
          <button id="submit" type="button">Submit</button>
        `;
        const input = root.getElementById("message");
        const button = root.getElementById("submit");
        button.addEventListener("click", () => {
          const value = input.value;
          const passed = value === "hello world";
          window.__webdrive.result = {
            passed,
            evidence: { value },
            time_ms: Date.now() - window.__webdrive.started_at,
          };
          document.getElementById("status").textContent = passed
            ? "PASS — message submitted correctly."
            : `FAIL — got "${value}".`;
        });
      }
    }
    customElements.define("shadow-form", ShadowForm);
  </script>
</body>
</html>
